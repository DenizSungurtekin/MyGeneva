# Docker Compose stack for local development.
#
# Services:
#   - postgres          : Postgres 16 + PostGIS 3.4 (data DB for the API + Airflow metadata)
#   - airflow-init      : one-shot service that runs `airflow db migrate` + creates the admin user
#   - airflow-webserver : Airflow UI on http://localhost:8080 (admin / admin)
#   - airflow-scheduler : runs the DAGs in /pipeline/dags
#
# Both API and Airflow point at the same Postgres instance, in different
# databases (`mygeneva` and `airflow`) — that is intentional for a solo dev
# setup; it keeps everything reproducible with a single volume.
#
# Usage:
#   docker compose up             # starts everything
#   docker compose up postgres    # just Postgres for running the backend directly

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: mygeneva-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mygeneva
      POSTGRES_PASSWORD: mygeneva
      POSTGRES_DB: mygeneva
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mygeneva -d mygeneva"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    image: apache/airflow:2.10.3-python3.11
    container_name: mygeneva-airflow-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mygeneva:mygeneva@postgres:5432/airflow
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW_UID: "50000"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      # Connection string Airflow tasks use to write to the app DB.
      AIRFLOW_CONN_MYGENEVA_DB: postgresql+psycopg2://mygeneva:mygeneva@postgres:5432/mygeneva
      _PIP_ADDITIONAL_REQUIREMENTS: "beautifulsoup4 lxml httpx"
    volumes:
      - ./pipeline/dags:/opt/airflow/dags
      - ./pipeline/logs:/opt/airflow/logs
      - ./pipeline/plugins:/opt/airflow/plugins
      - ./pipeline/scripts:/opt/airflow/scripts
      - ./:/opt/airflow/repo:ro
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate && \
        airflow users create \
          --username "$${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Admin --lastname Local \
          --role Admin --email admin@example.com || true

  airflow-webserver:
    image: apache/airflow:2.10.3-python3.11
    container_name: mygeneva-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mygeneva:mygeneva@postgres:5432/airflow
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW_UID: "50000"
      AIRFLOW_CONN_MYGENEVA_DB: postgresql+psycopg2://mygeneva:mygeneva@postgres:5432/mygeneva
      MYGENEVA_DATABASE_URL: postgresql+psycopg2://mygeneva:mygeneva@postgres:5432/mygeneva
      MYGENEVA_SCRAPE_DAYS: "1"
      _PIP_ADDITIONAL_REQUIREMENTS: "beautifulsoup4 lxml httpx"
    ports:
      - "8080:8080"
    volumes:
      - ./pipeline/dags:/opt/airflow/dags
      - ./pipeline/logs:/opt/airflow/logs
      - ./pipeline/plugins:/opt/airflow/plugins
      - ./pipeline/scripts:/opt/airflow/scripts
      - ./:/opt/airflow/repo:ro
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.10.3-python3.11
    container_name: mygeneva-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mygeneva:mygeneva@postgres:5432/airflow
      AIRFLOW_UID: "50000"
      AIRFLOW_CONN_MYGENEVA_DB: postgresql+psycopg2://mygeneva:mygeneva@postgres:5432/mygeneva
      MYGENEVA_DATABASE_URL: postgresql+psycopg2://mygeneva:mygeneva@postgres:5432/mygeneva
      MYGENEVA_SCRAPE_DAYS: "1"
      _PIP_ADDITIONAL_REQUIREMENTS: "beautifulsoup4 lxml httpx"
    volumes:
      - ./pipeline/dags:/opt/airflow/dags
      - ./pipeline/logs:/opt/airflow/logs
      - ./pipeline/plugins:/opt/airflow/plugins
      - ./pipeline/scripts:/opt/airflow/scripts
      - ./:/opt/airflow/repo:ro
    command: scheduler

volumes:
  postgres_data:
    name: mygeneva_postgres_data
